<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>粒子花朵</title>
<style>
*{box-sizing:border-box}
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#020101}
#stage{display:block;cursor:pointer;touch-action:manipulation}
button{padding:10px 17px;border:1px solid #7b615b66;border-radius:24px;color:#dcc4bc;background:#1a1314cc;font:13px system-ui;cursor:pointer;backdrop-filter:blur(12px)}
button:hover,button:focus-visible{background:#342022}
button:disabled{opacity:.55;cursor:wait}
.controls{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:9px}
#gesture-status{position:fixed;left:20px;right:20px;top:max(20px,env(safe-area-inset-top));text-align:center;color:#e0c7baa8;font:13px system-ui;letter-spacing:.08em;pointer-events:none}
#hand-video{position:fixed;left:18px;bottom:18px;width:128px;height:96px;object-fit:cover;border-radius:12px;border:1px solid #d6aa8c55;transform:scaleX(-1);opacity:.70;pointer-events:none}
#hand-cursor{position:fixed;width:70px;height:70px;border:1px solid #f2a27c88;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 32px #e54c3c33;pointer-events:none;transition:width .2s,height .2s}
#hand-cursor[data-pose=fist]{width:26px;height:26px;border-color:#ff7968;box-shadow:0 0 35px #ff655688}
[hidden]{display:none!important}
#status{position:fixed;top:50%;width:100%;text-align:center;color:#e3bcb4;font:14px system-ui}
#music-panel{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:242px;max-height:80vh;overflow:auto;padding:17px 15px 13px;border:1px solid #bbcce325;border-radius:19px;background:linear-gradient(145deg,#151a24e8,#111015e8);box-shadow:0 18px 60px #0005;backdrop-filter:blur(22px);color:#e4e9f2;font:12px system-ui}
.music-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.music-heading strong{font-size:14px;letter-spacing:.10em;font-weight:500}
#music-caption{font-size:11px;line-height:1.7;color:#a2adbe;margin:0 0 12px;min-height:17px}
#music-play{width:30px;height:30px;padding:0;display:grid;place-items:center;border-color:#c3d6f544;border-radius:50%;background:#b9d1f418;color:#e8f0ff;font-size:12px}
#music-meter{display:flex;align-items:center;gap:3px;height:18px;margin-left:auto;margin-right:9px}
#music-meter i{width:2px;height:2px;border-radius:2px;background:#bed7ff;opacity:.75;transition:height .06s linear}
#music-tracks{display:grid;gap:4px}
.music-track{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 8px;border:1px solid transparent;border-radius:10px;background:transparent;backdrop-filter:none;color:#c7ceda;font:inherit;min-height:49px}
.music-track:hover,.music-track:focus-visible{background:#b8cbea0e}
.music-track.is-current{background:#acc9f214;border-color:#bdd5f224;color:#edf4ff}
.track-number{font-size:9px;letter-spacing:.05em;color:#657489;flex:none}
.track-copy{display:block;min-width:0;flex:1}
.track-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:500}
.track-copy small{display:block;margin-top:4px;color:#8392a6;font-size:10px}
.track-indicator{color:#a8bddc;font-size:12px;flex:none}
.music-progress{margin-top:12px;padding:0 3px}
#music-seek{display:block;width:100%;height:10px;margin:0;accent-color:#bfd8ff;cursor:pointer}
.music-footer{display:flex;align-items:center;justify-content:space-between;margin-top:5px;color:#8392a6;font-size:9px}
.music-volume{display:flex;align-items:center;gap:5px}
#music-volume{width:54px;height:9px;accent-color:#bfd8ff;cursor:pointer}
#music-seek,#music-volume{appearance:none;-webkit-appearance:none;background:transparent}
#music-seek::-webkit-slider-runnable-track,#music-volume::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:#b8c9e24a}
#music-seek::-webkit-slider-thumb,#music-volume::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:#c7dcff;margin-top:-3px;box-shadow:0 0 7px #afcfff33}
.music-credit{margin-top:10px;border-top:1px solid #c2d2ea12;padding-top:8px;font-size:9px;line-height:1.8;color:#718098}
.music-credit summary{cursor:pointer;list-style:none}
.music-credit summary::after{content:' +';color:#8fa2bd}
.music-credit[open] summary::after{content:' −'}
.music-credit p{margin:5px 0}
.music-credit a{color:#a0b7d8;text-decoration:none}
@media(max-width:760px){#music-panel{left:14px;right:auto;top:auto;bottom:88px;transform:none;width:202px;padding:10px 10px 8px;border-radius:15px;max-height:60vh}.music-heading strong{font-size:12px}#music-play{width:26px;height:26px}#music-caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0;min-height:0}#music-tracks{gap:3px}.music-track{min-height:34px;padding:4px 6px;gap:7px}.track-copy strong{font-size:10px;line-height:1.2}.track-copy small{font-size:9px;line-height:1.2;margin-top:2px}.music-progress{margin-top:7px}.music-credit{margin-top:5px;padding-top:4px;font-size:8px}#hand-video{width:88px;height:66px}}
@media(max-width:500px){#hand-video{width:88px;height:66px}.controls{right:14px;bottom:20px;gap:6px}button{padding:9px 12px;font-size:12px}#gesture-status{font-size:12px}}
.return-desk{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));display:inline-flex;align-items:center;min-height:40px;padding:7px 15px;border:1px solid #b8bad786;border-radius:999px;background:#151627e8;color:#f5e9f6;text-decoration:none;font:14px/1.3 system-ui,sans-serif}
.return-desk:focus-visible{outline:2px solid #fff;outline-offset:3px}
.return-desk:hover{background:#363149}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/package/build/three.module.js","three/addons/":"./vendor/package/examples/jsm/"}}
</script>
</head>
<body>
<a class="return-desk" href="../?rose=21">← 返回窗边</a>
<canvas id="stage" aria-label="张掌拨动银河星光，握拳汇聚成红玫瑰"></canvas>
<p id="gesture-status" role="status" aria-live="polite">张掌拨动银河 · 握拳成花</p>
<video id="hand-video" autoplay muted playsinline hidden aria-label="手势摄像头预览"></video>
<div id="hand-cursor" hidden></div>
<aside id="music-panel" aria-label="玫瑰音乐列表" hidden>
<div class="music-heading"><strong>花间音乐</strong><span id="music-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span><button id="music-play" type="button" aria-label="播放音乐">▶</button></div>
<button id="music-mic" type="button" aria-pressed="false" style="display:block;margin:.35rem 0;color:inherit;background:#ffffff16;border:1px solid #ffffff47;border-radius:.5rem;padding:.35rem .6rem;font:inherit;cursor:pointer">使用麦克风</button>
<p id="music-caption" role="status">选一首，让粒子随音乐流动</p>
<div id="music-tracks"></div>
<div class="music-progress"><input id="music-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="音乐播放进度"><div class="music-footer"><span id="music-time">0:00 / 0:00</span><label class="music-volume">音量<input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="音乐音量"></label></div></div>
<details class="music-credit"><summary>Kevin MacLeod · 音乐署名</summary><div id="music-credit-tracks"></div><p>来源：<a href="https://incompetech.com/" target="_blank" rel="noopener">incompetech.com</a>。音频经压缩以便离线播放。</p></details>
</aside>
<audio id="soundtrack" preload="metadata"></audio>
<div class="controls">
<button id="gesture" type="button" aria-pressed="false">开启手势</button>
<button id="replay" type="button" aria-pressed="false">聚成玫瑰</button>
</div>
<p id="status" role="status" hidden></p>
<script id="hand-assets" type="application/json">{"embedded":false}</script>
<script id="music-assets" type="application/json">{"musicEmbedded":false}</script>

</body>
</html>
